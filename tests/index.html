<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oyun Gecesi — Testler</title>
  <link rel="stylesheet" href="../css/app.css">
  <style>
    .t { padding: 6px 10px; border-radius: 8px; margin-bottom: 4px; font-family: ui-monospace, monospace; font-size: 0.9rem; }
    .t.ok { background: rgba(76, 175, 80, 0.15); }
    .t.fail { background: rgba(229, 72, 77, 0.15); }
    .t pre { white-space: pre-wrap; margin: 4px 0 0; font-size: 0.8rem; }
    .summary { font-weight: 700; margin: 12px 0; }
  </style>
</head>
<body>
  <main id="app">
    <header class="topbar"><a class="btn btn-icon" href="../index.html" aria-label="Geri">←</a><h1 class="topbar-title">Testler</h1><span></span></header>
    <div id="summary" class="summary">Çalışıyor…</div>
    <div id="results"></div>
  </main>
  <script type="module">
    import { runAll } from './runner.js';
    import './all.js';
    const box = document.getElementById('results');
    const { passed, failed } = await runAll((r) => {
      const div = document.createElement('div');
      div.className = `t ${r.ok ? 'ok' : 'fail'}`;
      div.textContent = `${r.ok ? '✓' : '✗'} ${r.name}`;
      if (!r.ok) { const pre = document.createElement('pre'); pre.textContent = r.error; div.append(pre); }
      box.append(div);
    });
    const s = document.getElementById('summary');
    s.textContent = `${passed} geçti, ${failed} kaldı`;
    s.style.color = failed ? 'var(--danger)' : 'var(--correct)';
    document.title = `${failed ? '✗' : '✓'} Testler`;
  </script>
</body>
</html>
